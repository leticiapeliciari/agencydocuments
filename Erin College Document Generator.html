document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 }}\" sc-camel-on-click=\"{{ setDublin }}\">Dublin<\u002Fbutton>\n      <button style=\"{{ cityCorkStyle }}\" sc-camel-on-click=\"{{ setCork }}\">Cork<\u002Fbutton>\n    <\u002Fdiv>\n\n    <div style=\"font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#88968a;margin-bottom:10px;\">Student details<\u002Fdiv>\n    <sc-for list=\"{{ formRows }}\" as=\"row\" hint-placeholder-count=\"9\">\n      <label style=\"display:block;margin-bottom:9px;\">\n        <span style=\"display:block;font-size:11px;font-weight:600;color:#5a6b5c;margin-bottom:3px;\">{{ row.label }}<\u002Fspan>\n        <input type=\"text\" value=\"{{ row.value }}\" sc-camel-on-input=\"{{ row.on }}\" style=\"width:100%;padding:8px 10px;border:1px solid #cfd8cf;border-radius:8px;background:#fff;font-size:13px;color:#173a24;\">\n      <\u002Flabel>\n    <\u002Fsc-for>\n    <label style=\"display:block;margin-bottom:9px;\">\n      <span style=\"display:block;font-size:11px;font-weight:600;color:#5a6b5c;margin-bottom:3px;\">Start date (Mondays only)<\u002Fspan>\n      <input type=\"date\" value=\"{{ startDateIso }}\" sc-camel-on-input=\"{{ onStartDate }}\" style=\"width:100%;padding:8px 10px;border:1px solid #cfd8cf;border-radius:8px;background:#fff;font-size:13px;color:#173a24;\">\n      <span style=\"{{ startDateHintStyle }}\">{{ startDateHint }}<\u002Fspan>\n    <\u002Flabel>\n    <div style=\"display:flex;gap:10px;\">\n      <sc-if value=\"{{ isLong }}\" hint-placeholder-val=\"{{ true }}\">\n      <label style=\"display:block;margin-bottom:9px;flex:1;\">\n        <span style=\"display:block;font-size:11px;font-weight:600;color:#5a6b5c;margin-bottom:3px;\">Period<\u002Fspan>\n        <sc-raw-select value=\"{{ period }}\" sc-camel-on-change=\"{{ onPeriod }}\" style=\"width:100%;padding:8px 10px;border:1px solid #cfd8cf;border-radius:8px;background:#fff;font-size:13px;color:#173a24;\">\n          <option>Morning<\u002Foption><option>Afternoon<\u002Foption><option>Evening<\u002Foption>\n        <\u002Fsc-raw-select>\n      <\u002Flabel>\n      <\u002Fsc-if>\n      <label style=\"display:block;margin-bottom:9px;flex:1;\">\n        <span style=\"display:block;font-size:11px;font-weight:600;color:#5a6b5c;margin-bottom:3px;\">Issue date<\u002Fspan>\n        <input type=\"text\" value=\"{{ date }}\" sc-camel-on-input=\"{{ onDate }}\" style=\"width:100%;padding:8px 10px;border:1px solid #cfd8cf;border-radius:8px;background:#fff;font-size:13px;color:#173a24;\">\n      <\u002Flabel>\n    <\u002Fdiv>\n\n    <div style=\"font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#88968a;margin:16px 0 10px;\">Course<\u002Fdiv>\n    <div style=\"display:flex;gap:8px;margin-bottom:12px;\">\n      <button style=\"{{ typeLongStyle }}\" sc-camel-on-click=\"{{ setLong }}\">Long term<\u002Fbutton>\n      <button style=\"{{ typeShortStyle }}\" sc-camel-on-click=\"{{ setShort }}\">Short course<\u002Fbutton>\n    <\u002Fdiv>\n    <sc-if value=\"{{ isShort }}\" hint-placeholder-val=\"{{ true }}\">\n      <label style=\"display:block;margin-bottom:9px;\">\n        <span style=\"display:block;font-size:11px;font-weight:600;color:#5a6b5c;margin-bottom:3px;\">Course &amp; time (sets the weekly rate)<\u002Fspan>\n        <sc-raw-select value=\"{{ shortOptVal }}\" sc-camel-on-change=\"{{ onShortOpt }}\" style=\"width:100%;padding:8px 10px;border:1px solid #cfd8cf;border-radius:8px;background:#fff;font-size:13px;color:#173a24;\">\n          <sc-for list=\"{{ shortOptions }}\" as=\"o\" hint-placeholder-count=\"3\">\n            <option value=\"{{ o.value }}\">{{ o.text }}<\u002Foption>\n          <\u002Fsc-for>\n        <\u002Fsc-raw-select>\n      <\u002Flabel>\n      <label style=\"display:block;margin-bottom:6px;\">\n        <span style=\"display:block;font-size:11px;font-weight:600;color:#5a6b5c;margin-bottom:3px;\">Weeks (1–24)<\u002Fspan>\n        <input type=\"number\" min=\"1\" max=\"24\" value=\"{{ weeks }}\" sc-camel-on-input=\"{{ onWeeks dc-script=\"\" data-props=\"{&quot;defaultCity&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Dublin&quot;,&quot;options&quot;:[&quot;Dublin&quot;,&quot;Cork&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;defaultCommission&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:30,&quot;min&quot;:0,&quot;max&quot;:100,&quot;unit&quot;:&quot;%&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;defaultDeposit&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:300,&quot;unit&quot;:&quot;\\u20ac&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;courseName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;GENERAL ENGLISH COURSE&quot;,&quot;tsType&quot;:&quot;string&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    city: this.props.defaultCity || 'Dublin',\n    view: 'invoice',\n    commPct: this.props.defaultCommission ?? 30,\n    deposit: this.props.defaultDeposit ?? 300,\n    depositDate: '',\n    remainingDate: '',\n    gross: 2245,\n    date: this.today(),\n    courseType: 'long',\n    shortOpt: 0,\n    weeks: 12,\n    courseName: this.props.courseName || 'GENERAL ENGLISH COURSE',\n    student: {\n      name: '', studentNumber: '', email: '', nationality: '', birth: '',\n      phone: '', passport: 'N/A', address: '', startDate: '', period: 'Morning'\n    },\n    items: [\n      { label: '25 weeks class + 8 weeks holidays', price: 1765, included: true, service: false },\n      { label: 'Medical Insurance', price: 150, included: true, service: true },\n      { label: 'Learner Protection', price: 150, included: true, service: true },\n      { label: 'TIE Exam', price: 130, included: true, service: true },\n      { label: 'Book', price: 50, included: true, service: true },\n    ],\n  };\n\n  longItems() {\n    return [\n      { label: '25 weeks class + 8 weeks holidays', price: 1765, included: true, service: false },\n      { label: 'Medical Insurance', price: 150, included: true, service: true },\n      { label: 'Learner Protection', price: 150, included: true, service: true },\n      { label: 'TIE Exam', price: 130, included: true, service: true },\n      { label: 'Book', price: 50, included: true, service: true },\n    ];\n  }\n\n  shortData() {\n    return {\n      Dublin: [\n        { label: 'General English', time: 'Morning', w: [155, 150, 145] },\n        { label: 'General English', time: 'Afternoon', w: [130, 125, 120] },\n        { label: 'General English/Exam Preparation', time: 'Morning', w: [160, 155, 150] },\n      ],\n      Cork: [\n        { label: 'General English', time: 'Morning', w: [155, 150, 145] },\n        { label: 'General English', time: 'Afternoon', w: [130, 125, 120] },\n      ],\n    };\n  }\n  svcData() { return { lp: [30, 50, 80, 150], hi: [40, 60, 100, 150] }; }\n  rateBand(w) { return w <= 5 ? 0 : w <= 10 ? 1 : 2; }\n  svcBand(w) { return w <= 4 ? 0 : w <= 8 ? 1 : w <= 12 ? 2 : w >= 25 ? 3 : 2; }\n\n  buildShort(city, optIdx, weeks) {\n    const list = this.shortData()[city] || this.shortData().Dublin;\n    const opt = list[Math.min(optIdx, list.length - 1)] || list[0];\n    const rate = opt.w[this.rateBand(weeks)];\n    const s = this.svcData(), sb = this.svcBand(weeks);\n    return [\n      { label: `${opt.label} (${opt.time}) \\u2013 ${weeks} ${weeks === 1 ? 'week' : 'weeks'}`, price: rate * weeks, included: true, service: false },\n      { label: 'Learner Protection', price: s.lp[sb], included: true, service: true },\n      { label: 'Health Insurance', price: s.hi[sb], included: true, service: true },\n      { label: 'Book', price: 50, included: true, service: true },\n    ];\n  }\n  rebuildShort(s, city, optIdx, weeks) {\n    const fresh = this.buildShort(city, optIdx, weeks), prev = s.items || [];\n    return fresh.map(f => {\n      const p = prev.find(x => x.label === f.label) || (f.service === false ? prev.find(x => x.service === false) : null);\n      return p ? { ...f, included: p.included } : f;\n    });\n  }\n\n  today() {\n    const d = new Date(), p = n => String(n).padStart(2, '0');\n    return `${p(d.getDate())}/${p(d.getMonth() + 1)}/${d.getFullYear()}`;\n  }\n\n  fmt(n) {\n    if (isNaN(n) || n == null) n = 0;\n    const neg = n < 0; n = Math.abs(n);\n    const cents = Math.round(n * 100) % 100;\n    const s = cents === 0\n      ? Math.round(n).toLocaleString('en-IE')\n      : n.toLocaleString('en-IE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });\n    return (neg ? '-\\u20ac ' : '\\u20ac ') + s;\n  }\n\n  updStudent(k, v) { this.setState(s => ({ student: { ...s.student, [k]: v } })); }\n  updItem(i, k, v) { this.setState(s => ({ items: s.items.map((it, idx) => idx === i ? { ...it, [k]: v } : it) })); }\n  addItem() { this.setState(s => ({ items: [...s.items, { label: 'New item', price: 0, included: true, tuition: false }] })); }\n  delItem(i) { this.setState(s => ({ items: s.items.filter((_, idx) => idx !== i) })); }\n  set(k, v) { this.setState({ [k]: v }); }\n  setCity(c) {\n    this.setState(s => {\n      if (s.courseType !== 'short') return { city: c };\n      const oi = Math.min(s.shortOpt, this.shortData()[c].length - 1);\n      const opt = this.shortData()[c][oi];\n      return { city: c, shortOpt: oi, items: this.rebuildShort(s, c, oi, s.weeks), student: opt ? { ...s.student, period: opt.time } : s.student };\n    });\n  }\n  setCourseType(t) {\n    this.setState(s => {\n      if (t === s.courseType) return null;\n      if (t !== 'short') return { courseType: 'long', items: this.longItems() };\n      const opt = (this.shortData()[s.city] || [])[s.shortOpt];\n      return { courseType: 'short', items: this.rebuildShort(s, s.city, s.shortOpt, s.weeks), student: opt ? { ...s.student, period: opt.time } : s.student };\n    });\n  }\n  setShortOpt(i) {\n    this.setState(s => {\n      const opt = (this.shortData()[s.city] || [])[i];\n      return { shortOpt: i, items: this.rebuildShort(s, s.city, i, s.weeks), student: opt ? { ...s.student, period: opt.time } : s.student };\n    });\n  }\n  setWeeks(w) { this.setState(s => ({ weeks: w, items: this.rebuildShort(s, s.city, s.shortOpt, w) })); }\n  onStartDate(v) {\n    if (!v) { this.updStudent('startDate', ''); return; }\n    const [y, m, d] = v.split('-').map(Number);\n    const dt = new Date(y, m - 1, d);\n    const shift = (dt.getDay() + 6) % 7; // 0 = já é segunda\n    dt.setDate(dt.getDate() - shift);\n    const iso = `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;\n    this.updStudent('startDate', iso);\n  }\n\n  renderVals() {\n    const st = this.state, S = st.student, fmt = this.fmt.bind(this);\n    const startDateIso = S.startDate || '';\n    let startDateDisplay = '\\u2014', startDateHint = '', snapped = false;\n    if (startDateIso) {\n      const [y, m, d] = startDateIso.split('-').map(Number);\n      startDateDisplay = `${String(d).padStart(2, '0')}-${String(m).padStart(2, '0')}-${y}`;\n    }\n    const banks = {\n      Dublin: { accountName: 'Erin School of English', accountNumber: '74354004', sortCode: '93-34-22', swift: 'AIBKIE2D', iban: 'IE47 AIBK 93 34 22 7435 4004', bankName: 'ALLIED IRISH BANK (AIB)', address: 'Dublin Road - DUBLIN' },\n      Cork: { accountName: 'Erin School of English', accountNumber: '68346000', sortCode: '93-11-01', swift: 'AIBKIE2D', iban: 'IE65 AIBK 93 11 01 6834 6000', bankName: 'ALLIED IRISH BANK (AIB)', address: 'Dublin Road - DUBLIN' },\n    };\n    const bank = banks[st.city] || banks.Dublin;\n    const inc = st.items.filter(it => it.included);\n    const servicesTotal = inc.filter(it => it.service).reduce((a, b) => a + (+b.price || 0), 0);\n    const tuitionBase = inc.filter(it => !it.service).reduce((a, b) => a + (+b.price || 0), 0);\n    const gross = tuitionBase + servicesTotal;\n    const commission = tuitionBase * (+st.commPct || 0) / 100;\n    const net = gross - commission;\n    const remaining = net - (+st.deposit || 0);\n\n    const btn = on => on\n      ? 'flex:1;padding:9px;border:none;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;background:#146b32;color:#fff;'\n      : 'flex:1;padding:9px;border:1px solid #cfd8cf;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;background:#fff;color:#5a6b5c;';\n\n    const formRows = [\n      ['name', 'Name'], ['studentNumber', 'Student number'], ['email', 'Email'],\n      ['nationality', 'Nationality'], ['birth', 'Birth (dd-mm-yyyy)'], ['phone', 'Phone'],\n      ['passport', 'Passport number'], ['address', 'Address'],\n    ].map(([k, label]) => ({ label, value: S[k], on: (e) => this.updStudent(k, e.target.value) }));\n\n    const itemViews = st.items.map((it, i) => ({\n      label: it.label, price: it.price, included: it.included, isService: it.service, notService: !it.service, priceStr: fmt(+it.price || 0),\n      onInc: (e) => this.updItem(i, 'included', e.target.checked),\n      onLabel: (e) => this.updItem(i, 'label', e.target.value),\n      onPrice: (e) => this.updItem(i, 'price', parseFloat(e.target.value) || 0),\n      onSvc: () => this.updItem(i, 'service', !it.service),\n      onDel: () => this.delItem(i),\n      svcStyle: (it.service ? 'background:#e07b1a;color:#fff;' : 'background:#e6ebe6;color:#96a398;')\n        + 'border:none;border-radius:6px;width:26px;height:30px;flex:none;cursor:pointer;font-weight:700;font-size:12px;',\n    }));\n\n    const studentFields = [\n      ['Name', S.name], ['Student number', S.studentNumber], ['Email', S.email],\n      ['Nationality', S.nationality], ['Birth', S.birth], ['Phone', S.phone],\n      ['Passport number', S.passport], ['Address', S.address],\n      ['Start date', startDateDisplay], ['Period', S.period],\n    ].map(([label, value]) => ({ label, value: (value === '' || value == null) ? '\\u2014' : value }));\n\n    const confItems = inc.map(it => ({ label: it.label }));\n    const invItems = inc.map(it => ({ label: it.label, price: fmt(+it.price || 0) }));\n    const bankRows = [\n      ['Account Name', bank.accountName], ['Account Number', bank.accountNumber],\n      ['Branch Sort Code', bank.sortCode], ['Swift Code', bank.swift],\n      ['IBAN', bank.iban], ['Bank Name', bank.bankName], ['Address', bank.address],\n    ].map(([label, value]) => ({ label, value }));\n    const installments = [\n      { name: 'Deposit', date: st.depositDate || '\\u2014', amount: fmt(+st.deposit || 0) },\n      { name: 'Remaining Amount', date: st.remainingDate || '\\u2014', amount: fmt(remaining) },\n    ];\n\n    const isShort = st.courseType === 'short';\n    const sList = this.shortData()[st.city] || [];\n    const shortOptions = sList.map((o, i) => ({ value: String(i), text: `${o.label} — ${o.time} (€${o.w[0]}/${o.w[1]}/${o.w[2]} per week)` }));\n    const curOpt = sList[Math.min(st.shortOpt, sList.length - 1)];\n    const shortRate = curOpt ? curOpt.w[this.rateBand(st.weeks)] : 0;\n    const shortRateHint = isShort && curOpt ? `€${shortRate}/week × ${st.weeks} = ${fmt(shortRate * st.weeks)} tuition` : '';\n\n    return {\n      city: st.city, date: st.date, courseName: st.courseName, period: S.period,\n      commPct: st.commPct, deposit: st.deposit, depositDate: st.depositDate, remainingDate: st.remainingDate,\n      invoiceTitle: `INVOICE - ${st.city}`,\n      descTitle: `DESCRIPTION \\u2013 (${st.courseName})`,\n      commissionLabel: `Commission (${st.commPct}%)`,\n      grossStr: fmt(gross), commissionStr: fmt(commission), netStr: fmt(net), tuitionStr: fmt(tuitionBase),\n      startDateIso, startDateDisplay,\n      startDateHint: 'Mondays only — the date is adjusted automatically.',\n      startDateHintStyle: 'display:block;font-size:10px;color:#88968a;margin-top:3px;',\n      onStartDate: (e) => this.onStartDate(e.target.value),\n      formRows, itemViews, studentFields, confItems, invItems, bankRows, installments,\n      isShort, shortOptions, shortRateHint,\n      isLong: !isShort,\n      shortOptVal: String(Math.min(st.shortOpt, Math.max(sList.length - 1, 0))),\n      weeks: st.weeks,\n      typeLongStyle: btn(!isShort),\n      typeShortStyle: btn(isShort),\n      setLong: () => this.setCourseType('long'),\n      setShort: () => this.setCourseType('short'),\n      onShortOpt: (e) => this.setShortOpt(parseInt(e.target.value, 10) || 0),\n      onWeeks: (e) => this.setWeeks(Math.max(1, Math.min(24, parseInt(e.target.value, 10) || 1))),\n      confDisplay: st.view === 'confirmation' ? 'block' : 'none',\n      invDisplay: st.view === 'invoice' ? 'block' : 'none',\n      cityDublinStyle: btn(st.city === 'Dublin'),\n      cityCorkStyle: btn(st.city === 'Cork'),\n      viewConfStyle: btn(st.view === 'confirmation'),\n      viewInvStyle: btn(st.view === 'invoice'),\n      setDublin: () => this.setCity('Dublin'),\n      setCork: () => this.setCity('Cork'),\n      setConf: () => this.set('view', 'confirmation'),\n      setInv: () => this.set('view', 'invoice'),\n      onPeriod: (e) => this.updStudent('period', e.target.value),\n      onDate: (e) => this.set('date', e.target.value),\n      onCourse: (e) => this.set('courseName', e.target.value),\n      onGross: (e) => this.set('gross', parseFloat(e.target.value) || 0),\n      grossVal: st.gross,\n      onComm: (e) => this.set('commPct', parseFloat(e.target.value) || 0),\n      onDeposit: (e) => this.set('deposit', parseFloat(e.target.value) || 0),\n      onDepDate: (e) => this.set('depositDate', e.target.value),\n      onRemDate: (e) => this.set('remainingDate', e.target.value),\n      addItem: () => this.addItem(),\n      doPrint: () => {\n        const num = (S.studentNumber || '').trim().replace(/[\\\\/:*?\"<>|]/g, '-') || 'Student';\n        const base = st.view === 'confirmation' ? 'Enrollment Confirmation' : 'Invoice';\n        const sheets = Array.from(document.querySelectorAll('.doc-sheet'));\n        const el = sheets.find(s => s.offsetParent !== null) || sheets[0];\n        if (!el || !window.html2pdf) {\n          const prev = document.title;\n          document.title = `${base}_${num}`;\n          const restore = () => { document.title = prev; window.removeEventListener('afterprint', restore); };\n          window.addEventListener('afterprint', restore);\n          window.print();\n          return;\n        }\n        window.html2pdf().set({\n          filename: `${base}_${num}.pdf`,\n          margin: 0,\n          image: { type: 'jpeg', quality: 0.98 },\n          html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff', windowWidth: el.scrollWidth },\n          jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },\n          pagebreak: { mode: ['css', 'legacy'] },\n        }).from(el).save();\n      },\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
